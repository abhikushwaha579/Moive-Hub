<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
</head>

<body>
    <main class="page-shell">
      <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">M</span> Movie Hub</a><div class="header-tools"><span class="header-note">Find your next favorite</span><button class="theme-toggle" type="button" aria-label="Switch to dark mode"></button></div></header>
      <section class="hero">
        <p class="eyebrow">YOUR PERSONAL MOVIE GUIDE</p>
        <h1>Search Your's favorite <span> Moives ?</span></h1>
        <p class="intro">Search films, explore the details, and pick your next movie night.</p>
        <form id="movieForm" class="search-form">
            <input id="movieInput" type="search" autocomplete="off" placeholder="Search a movie title…" aria-label="Movie title">
            <button type="submit">Search <span aria-hidden="true">→</span></button>
        </form>
      </section>
      <section class="movies-section" aria-labelledby="moviesHeading">
        <div class="section-heading"><h2 id="moviesHeading">🎬 Recently Released Movies</h2><p id="moviesSubheading">Fresh picks from 2024–2026</p></div>
        <div id="movieHub" class="movie-grid" aria-live="polite" aria-busy="true"></div>
      </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
